name: CI — Tests

on:
  push:
    branches-ignore: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type check
        id: typecheck
        run: npx tsc --noEmit
        continue-on-error: true

      - name: ESLint
        id: eslint
        run: npm run lint
        continue-on-error: true

      - name: Write job summary
        if: always()
        run: |
          echo "## Lint & Type Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.typecheck.outcome }}" == "success" ]; then
            echo "| TypeScript | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| TypeScript | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.eslint.outcome }}" == "success" ]; then
            echo "| ESLint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| ESLint | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any check failed
        if: steps.typecheck.outcome == 'failure' || steps.eslint.outcome == 'failure'
        run: exit 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          GITHUB_ACTIONS: true
