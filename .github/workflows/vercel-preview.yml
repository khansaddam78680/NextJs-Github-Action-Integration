name: Preview Vercel Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

  #To use this workflow in different action we need to put workflow_call
  workflow_call: {}

permissions:
  contents: read #Allows the workflow to read the repository contents.
  actions: read # Reads information about github actions resources.

jobs:
  test_app:
    name: Perform Tests
    uses: ./.github/workflows/test.yml

  vercel_preview_deploy:
    needs: [test_app]
    name: Deploy Vercel Preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Build Project
        run: |
          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview to Vercel
        id: deploy
        run: |
          set -euo pipefail
          url=$(vercel deploy \
              --prebuilt \
              --token=${{ secrets.VERCEL_TOKEN }} \
              --yes)

          echo "preview_url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_REF: ${{ github.head_ref }}

  print_preview_url:
    needs: [test_app, vercel_preview_deploy]
    name: Print Vercel Preview Url to summary.
    runs-on: ubuntu-latest
    steps:
      - name: Generate github summary to print the vercel preview url
        run: |
          echo "## ðŸš€ Preview Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | ${{ needs.vercel_preview_deploy.outputs.preview_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.head_ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY